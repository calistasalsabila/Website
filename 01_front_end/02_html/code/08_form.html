<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulir Ga Tau ya Random</h1>
    <!-- kalo ga di definisikan methodnya biasanya pakai get  -->
     <!-- daftar tu buat nanti ke link daftar kalo misal button di pencet  -->
    <form action="/daftar" method="post">
        <!-- for sama id samain  -->
         <!-- pake div biar hasilnya ke bawah (block), bisa pakai p atau span  -->

         <!-- button ni tanpe mengirim ke daftar, cm pencet aja  -->
          <button type="button"> apa ya</button>
        <div>
            <label for="name">Name</label>
            <input type="text" placeholder="Name" id="name" name="name">
        </div>


        
         <div>
            <label for="email">Email</label>
            <input type="email" placeholder="Email" id="email" name="email">
         </div>

        <div>
            <label for="password">Password</label>
            <input type="password" placeholder="Password" id="password" name="passwword">
        </div>
        
        <div>
            <label for="number">Number</label>
            <input type="number" placeholder="Number" id="number" name="number">
        </div>
        
      <button>Send</button>

      <button type="submit">sendddd</button>
      <!-- kalo pake input ubah aja type nya ke button  -->
      <input type="submit" value="Daftar">
        
    </form>


    <hr> 

    <h1>Order Here</h1>
    <form action="/order">

        <div>
            <!-- name bagian label di tulis sama dengan judul biar bisa pilih salah satu  -->
            <!-- checked berguna untuk default tombol yang udah di centang di radio button  -->
            <label for="">ORV</label>
            <input type="radio" name="ORV" id="" value="dokja"> <label for="">dokja</label>
            <input type="radio" name="ORV" id="" value="jeha" checked> <label for="">jeha</label>
            

        </div>

        <div>
            <label for="dokaebi">dokaebi</label>
            <select name="ukuran" id="ukuran">
                <option>-</option>
                <!-- kalau mau udah otomatis select , tinggal tambahi selected  -->
                <option value="fourt wall" selected>fourth wall</option>
                <option value="biyoo">biyoo</option>

            </select>
        </div>

        <hr>
            <label for="term">sesuai yea</label>
            <input type="checkbox" name="term" id="term" value="1">
       
        <div>
            <p>
            <label for="notes">Catatan</label>
            </p>
            <textarea name="notes" id="notes" cols="20" rows="3"></textarea>
            
        </div>
        <!-- shortcut : button:submit  -->
            <button type="submit">Order</button>
    </form>

</body>
</html>
