<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulir Ga Tau ya Random</h1>
    <!-- kalo ga di definisikan methodnya biasanya pakai get  -->
     <!-- daftar tu buat nanti ke link daftar kalo misal button di pencet  -->
    <form action="/daftar" method="post">
        <!-- for sama id samain  -->
         <!-- pake div biar hasilnya ke bawah (block), bisa pakai p atau span  -->

         <!-- button ni tanpe mengirim ke daftar, cm pencet aja  -->
          <button type="button"> apa ya</button>
        <div>
            <label for="name">Name</label>
            <input type="text" placeholder="Name" id="name">
        </div>


        
         <div>
            <label for="email">Email</label>
            <input type="email" placeholder="Email" id="email">
         </div>

        <div>
            <label for="password">Password</label>
            <input type="password" placeholder="Password" id="password">
        </div>
        
        <div>
            <label for="number">Number</label>
            <input type="number" placeholder="Number" id="number">
        </div>
        
      <button>Send</button>

      <button type="submit">sendddd</button>
      <!-- kalo pake input ubah aja type nya ke button  -->
      <input type="button" value="Daftar">
        
    </form>
</body>
</html>
